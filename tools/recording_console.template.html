<title>上下水道 読み上げ録音</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600&display=swap">
<style>
:root{
  --ground:#eef2f4; --surface:#ffffff; --surface-2:#f6f9fa;
  --ink:#12202a; --ink-2:#40525e; --muted:#6b7d88;
  --line:#d7e0e5; --line-strong:#b9c7ce;
  --accent:#0e6d78; --accent-ink:#ffffff; --accent-soft:#dceef0;
  --rec:#bf332f; --rec-soft:#f7e2e1;
  --done:#2b6b52; --done-soft:#dcece5;
  --shadow:0 1px 2px rgba(18,32,42,.06),0 8px 24px rgba(18,32,42,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0c141a; --surface:#141f27; --surface-2:#1a2831;
    --ink:#e7eef2; --ink-2:#a9bcc6; --muted:#8096a2;
    --line:#26363f; --line-strong:#3a4e59;
    --accent:#3fb0bb; --accent-ink:#06222a; --accent-soft:#17323a;
    --rec:#e4726d; --rec-soft:#3a1f20;
    --done:#63b892; --done-soft:#17332a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#0c141a; --surface:#141f27; --surface-2:#1a2831;
  --ink:#e7eef2; --ink-2:#a9bcc6; --muted:#8096a2;
  --line:#26363f; --line-strong:#3a4e59;
  --accent:#3fb0bb; --accent-ink:#06222a; --accent-soft:#17323a;
  --rec:#e4726d; --rec-soft:#3a1f20;
  --done:#63b892; --done-soft:#17332a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
  font-size:15px; line-height:1.7;
}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:16px}

/* --- progress rail --- */
.rail{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.rail h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.02em}
.rail .count{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:13px}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card.pad{padding:20px}

/* --- setup --- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;font-weight:500;color:var(--ink-2);letter-spacing:.04em}
select,button{font:inherit;color:inherit}
select{padding:9px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-2);width:100%}
.note{font-size:13px;color:var(--muted);margin:0}

/* --- script --- */
.script{padding:32px 28px;text-align:center}
.slug{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;font-variant-numeric:tabular-nums}
.line{
  font-family:"Noto Serif JP",serif;font-weight:400;
  font-size:clamp(21px,3.6vw,30px);line-height:1.9;margin:14px 0 0;
  text-wrap:balance;
}
.line mark{background:var(--accent-soft);color:inherit;padding:.06em .18em;border-radius:4px;font-weight:600}
.state{margin-top:14px;font-size:13px;color:var(--muted);min-height:1.6em}
.state.rec{color:var(--rec);font-weight:700}
.state.has{color:var(--done);font-weight:500}

/* --- transport --- */
.transport{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:0 20px 22px}
button{
  border:1px solid var(--line-strong);background:var(--surface-2);
  padding:11px 18px;border-radius:9px;cursor:pointer;font-weight:500;
}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;min-width:190px}
button.recording{background:var(--rec);border-color:var(--rec);color:#fff}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 20px 18px}
.meter>i{display:block;height:100%;width:0;background:var(--done)}
.meter.hot>i{background:var(--rec)}

/* --- index grid --- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;padding:16px}
.cell{
  border:1px solid var(--line);background:var(--surface-2);border-radius:7px;
  padding:7px 0;font-size:12px;font-variant-numeric:tabular-nums;cursor:pointer;text-align:center;
}
.cell.done{background:var(--done-soft);border-color:var(--done);color:var(--done);font-weight:700}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:16px 20px;border-top:1px solid var(--line)}
.foot .spacer{margin-left:auto}
.hidden{display:none!important}
.kbd{font-size:12px;color:var(--muted)}
.kbd b{font-weight:500;color:var(--ink-2);border:1px solid var(--line-strong);border-radius:4px;padding:1px 5px;background:var(--surface-2)}
</style>

<div class="wrap">
  <div class="rail">
    <h1>上下水道 読み上げ録音</h1>
    <span class="count" id="count">—</span>
  </div>
  <div class="bar"><i id="bar"></i></div>

  <!-- setup -->
  <section class="card pad" id="setup">
    <div class="field">
      <label for="mic">マイク</label>
      <select id="mic"><option>「マイクを準備」を押すと一覧が出ます</option></select>
    </div>
    <p class="note">
      静かな場所で、普段の速さで読んでください。言い直したら録り直せます。<br>
      録音はこの端末のブラウザ内に保存され、書き出すまで外部には送られません。
    </p>
    <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="primary" id="startBtn">マイクを準備して開始</button>
    </div>
  </section>

  <!-- recorder -->
  <section class="card hidden" id="rec">
    <div class="script">
      <div class="slug" id="slug">—</div>
      <p class="line" id="line">—</p>
      <div class="state" id="state"></div>
    </div>
    <div class="meter" id="meterWrap"><i id="meter"></i></div>
    <div class="transport">
      <button class="primary" id="recBtn">● 録音開始</button>
      <button id="playBtn" disabled>▶ 再生</button>
      <button id="redoBtn" disabled>録り直す</button>
    </div>
    <div class="foot">
      <button id="prevBtn">← 前</button>
      <button id="nextBtn">次 →</button>
      <span class="kbd"><b>Space</b> 録音/停止　<b>←</b><b>→</b> 移動</span>
      <span class="spacer"></span>
      <button id="exportBtn" class="primary">録音を書き出す</button>
    </div>
  </section>

  <section class="card hidden" id="listCard">
    <div class="grid" id="grid"></div>
  </section>
</div>

<script>
const SENTENCES = __SENTENCES__;

const $ = id => document.getElementById(id);
const TARGET_RATE = 16000;
const CHUNK_BYTES = 7 * 1024 * 1024;   // 1ファイルあたりの目安。downloads の上限は16MiB。

let stream=null, ctx=null, srcNode=null, procNode=null, analyser=null;
let recording=false, chunks=[], cur=0, takes={}, rafId=0;

/* ---------- IndexedDB: 100件のWAVはlocalStorageに入らない ---------- */
let db=null;
function openDb(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open("jgs-rec",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("takes");
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
function dbPut(k,v){return new Promise((res,rej)=>{const t=db.transaction("takes","readwrite");t.objectStore("takes").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
function dbDel(k){return new Promise((res,rej)=>{const t=db.transaction("takes","readwrite");t.objectStore("takes").delete(k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
function dbAll(){return new Promise((res,rej)=>{const out={};const t=db.transaction("takes","readonly");const s=t.objectStore("takes").openCursor();
  s.onsuccess=e=>{const c=e.target.result; if(c){out[c.key]=c.value; c.continue();} else res(out);}; s.onerror=()=>rej(s.error);});}

/* ---------- audio ---------- */
async function listMics(){
  try{
    const devs=await navigator.mediaDevices.enumerateDevices();
    const mics=devs.filter(d=>d.kind==="audioinput");
    $("mic").innerHTML = mics.length
      ? mics.map((d,i)=>`<option value="${d.deviceId}">${d.label||("マイク "+(i+1))}</option>`).join("")
      : "<option>マイクが見つかりません</option>";
  }catch(e){/* 権限前は一覧が取れない */}
}
function graph(){
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  srcNode=ctx.createMediaStreamSource(stream);
  analyser=ctx.createAnalyser(); analyser.fftSize=512;
  srcNode.connect(analyser);
}
function meterLoop(){
  const buf=new Uint8Array(analyser.frequencyBinCount);
  const tick=()=>{
    analyser.getByteTimeDomainData(buf);
    let peak=0; for(const v of buf) peak=Math.max(peak,Math.abs(v-128)/128);
    $("meter").style.width=Math.min(100,peak*160)+"%";
    $("meterWrap").classList.toggle("hot",peak>0.85);
    rafId=requestAnimationFrame(tick);
  };
  tick();
}
function startRec(){
  if(recording) return;
  chunks=[];
  procNode=ctx.createScriptProcessor(4096,1,1);
  procNode.onaudioprocess=e=>{ if(recording) chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
  srcNode.connect(procNode);
  procNode.connect(ctx.destination);   // onaudioprocess を発火させるために必要
  recording=true;
  $("recBtn").textContent="■ 停止"; $("recBtn").classList.add("recording");
  $("state").textContent="録音中…"; $("state").className="state rec";
}
async function stopRec(){
  if(!recording) return;
  recording=false;
  try{ srcNode.disconnect(procNode); procNode.disconnect(); }catch(e){}
  procNode=null;
  $("recBtn").textContent="● 録音開始"; $("recBtn").classList.remove("recording");
  const pcm=merge(chunks); chunks=[];
  if(pcm.length < ctx.sampleRate*0.3){ $("state").textContent="短すぎます。録り直してください。"; $("state").className="state"; return; }
  const wav=encodeWav(pcm,ctx.sampleRate,TARGET_RATE);
  const item=SENTENCES[cur];
  takes[item.id]={bytes:wav, sec:+(pcm.length/ctx.sampleRate).toFixed(2)};
  await dbPut(item.id,takes[item.id]);
  render();
  if(cur < SENTENCES.length-1) setTimeout(()=>go(1),350);
}
function merge(cks){let n=0;cks.forEach(c=>n+=c.length);const o=new Float32Array(n);let p=0;cks.forEach(c=>{o.set(c,p);p+=c.length});return o;}
function downsample(buf,inR,outR){
  if(outR>=inR) return buf;
  const ratio=inR/outR, outLen=Math.round(buf.length/ratio), out=new Float32Array(outLen);
  let op=0, ip=0;
  while(op<outLen){ const next=Math.round((op+1)*ratio); let s=0,c=0;
    for(let i=ip;i<next&&i<buf.length;i++){s+=buf[i];c++;}
    out[op++]=c?s/c:0; ip=next; }
  return out;
}
function encodeWav(samples,inR,outR){
  const d=downsample(samples,inR,outR);
  const b=new ArrayBuffer(44+d.length*2), v=new DataView(b);
  const wr=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  wr(0,"RIFF");v.setUint32(4,36+d.length*2,true);wr(8,"WAVE");
  wr(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,outR,true);v.setUint32(28,outR*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  wr(36,"data");v.setUint32(40,d.length*2,true);
  let off=44;
  for(let i=0;i<d.length;i++){const s=Math.max(-1,Math.min(1,d[i]));v.setInt16(off,s<0?s*0x8000:s*0x7fff,true);off+=2;}
  return new Uint8Array(b);
}

/* ---------- ui ---------- */
function render(){
  const item=SENTENCES[cur], t=takes[item.id];
  $("slug").textContent=`${item.id}　${cur+1} / ${SENTENCES.length}`;
  $("line").innerHTML=item.text.replace(item.term,`<mark>${item.term}</mark>`);
  if(t){ $("state").textContent=`録音済み（${t.sec} 秒）`; $("state").className="state has"; }
  else { $("state").textContent=""; $("state").className="state"; }
  $("playBtn").disabled=!t; $("redoBtn").disabled=!t;
  $("prevBtn").disabled=cur===0; $("nextBtn").disabled=cur===SENTENCES.length-1;
  const n=Object.keys(takes).length;
  $("count").textContent=`${n} / ${SENTENCES.length} 録音済み`;
  $("bar").style.width=(n/SENTENCES.length*100)+"%";
  [...$("grid").children].forEach((el,i)=>{
    el.classList.toggle("done",!!takes[SENTENCES[i].id]);
    el.classList.toggle("cur",i===cur);
  });
}
function go(d){ if(recording) return; cur=Math.max(0,Math.min(SENTENCES.length-1,cur+d)); render(); }

$("startBtn").onclick=async()=>{
  try{
    const id=$("mic").value;
    stream=await navigator.mediaDevices.getUserMedia({audio:{
      deviceId:id&&id.length>10?{exact:id}:undefined,
      channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  }catch(e){ alert("マイクを使えませんでした: "+e.message+"\nブラウザの許可設定を確認してください。"); return; }
  await listMics(); graph(); meterLoop();
  $("setup").classList.add("hidden");
  $("rec").classList.remove("hidden");
  $("listCard").classList.remove("hidden");
  render();
};
$("recBtn").onclick=()=>recording?stopRec():startRec();
$("playBtn").onclick=()=>{
  const t=takes[SENTENCES[cur].id]; if(!t) return;
  const url=URL.createObjectURL(new Blob([t.bytes],{type:"audio/wav"}));
  const a=new Audio(url); a.play(); a.onended=()=>URL.revokeObjectURL(url);
};
$("redoBtn").onclick=async()=>{
  const id=SENTENCES[cur].id; delete takes[id]; await dbDel(id); render();
};
$("prevBtn").onclick=()=>go(-1);
$("nextBtn").onclick=()=>go(1);
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="SELECT"||$("rec").classList.contains("hidden")) return;
  if(e.code==="Space"){e.preventDefault(); recording?stopRec():startRec();}
  else if(e.code==="ArrowLeft") go(-1);
  else if(e.code==="ArrowRight") go(1);
});

/* ---------- export ---------- */
function b64(bytes){
  let s=""; const N=0x8000;
  for(let i=0;i<bytes.length;i+=N) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+N));
  return btoa(s);
}
$("exportBtn").onclick=async()=>{
  const dl=await claude.use("downloads");
  if(!dl){ alert("この画面では書き出せません。artifact を開き直してください。"); return; }
  const done=SENTENCES.filter(s=>takes[s.id]);
  if(!done.length){ alert("まだ録音がありません。"); return; }

  // downloads は zip/wav を受け付けないので、WAVをbase64にしてJSONで渡す。
  // 1ファイル16MiBの上限があるため、目安サイズで分割する。
  const parts=[[]]; let size=0;
  for(const s of done){
    const t=takes[s.id];
    const est=t.bytes.length*1.37;
    if(size+est>CHUNK_BYTES && parts[parts.length-1].length){ parts.push([]); size=0; }
    parts[parts.length-1].push({id:s.id,term:s.term,text:s.text,sec:t.sec,wav_b64:b64(t.bytes)});
    size+=est;
  }
  for(let i=0;i<parts.length;i++){
    const body={format:"jgs-recordings/1",sample_rate:TARGET_RATE,part:i+1,parts:parts.length,items:parts[i]};
    try{
      await dl.save({filename:`recordings_${String(i+1).padStart(2,"0")}of${String(parts.length).padStart(2,"0")}.json`,
                     data:JSON.stringify(body)});
    }catch(err){
      alert(`${i+1}個目の保存が完了しませんでした（${err.code||"error"}）。\n録音は消えていません。もう一度お試しください。`);
      return;
    }
  }
  alert(`${done.length} 件を ${parts.length} 個のファイルに書き出しました。`);
};

/* ---------- boot ---------- */
(async()=>{
  $("grid").innerHTML=SENTENCES.map((s,i)=>`<button class="cell" data-i="${i}">${i+1}</button>`).join("");
  $("grid").onclick=e=>{const b=e.target.closest(".cell"); if(b&&!recording){cur=+b.dataset.i; render();}};
  db=await openDb();
  takes=await dbAll();
  const n=Object.keys(takes).length;
  $("count").textContent = n ? `${n} / ${SENTENCES.length} 録音済み（前回の続きから）` : `0 / ${SENTENCES.length} 録音済み`;
  $("bar").style.width=(n/SENTENCES.length*100)+"%";
  const firstEmpty=SENTENCES.findIndex(s=>!takes[s.id]);
  cur=firstEmpty<0?0:firstEmpty;
  await listMics();
})();
</script>
