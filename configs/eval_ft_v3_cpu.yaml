# v3 評価: 3文/用語 + 多声(jm_kumo除外) で学習した CT2 モデルを CPU で。
# 音声は v1 と同一 (Kokoro jm_kumo)。学習側から jm_kumo を外して話者を分けてある。
dataset:
  manifest: out/eval_audio/stream_manifest.jsonl
  audio_dir: out/eval_audio/tts

output:
  dir: experiments/ft_turbo_v3
  predictions_jsonl: predictions.jsonl
  summary_json: summary.json
  report_md: report.md

whisper_streaming:
  repo_dir: vendor/whisper_streaming
  language: ja
  task: transcribe
  backend: faster-whisper
  min_chunk_size: 1.0
  buffer_trimming: segment
  buffer_trimming_sec: 15
  warmup: true
  vad: false
  condition_on_previous_text: false
  use_initial_prompt: false
  temperature: 0.0
  no_speech_threshold: 0.6
  log_prob_threshold: -1.0
  compression_ratio_threshold: 2.4
  repetition_penalty: 1.1
  no_repeat_ngram_size: 3
  hallucination_silence_threshold: 2.0
  max_new_tokens: 192

model:
  model_dir: out/ct2_ft_v3
  device: cpu
  compute_type: int8
  beam_size: 3

metrics:
  japanese_word_tokenizer: true
  repetition_ngram_size: 3
  # 上下水道の専門用語だけを分母にした B-WER を出す
  bias_terms: data/test_sentences_100.tsv
