# CTranslate2形式のfine-tuned Whisperをwhisper-streamingで評価する設定例。
# PBSから CONFIG=configs/whisper_streaming_eval.yaml として渡せます。

dataset:
  manifest: out/whisper_streaming_eval/audio/manifest.jsonl
  audio_dir: out/whisper_streaming_eval/audio

output:
  dir: experiments/whisper_streaming_eval
  predictions_jsonl: predictions.jsonl
  summary_json: summary.json
  report_md: report.md

whisper_streaming:
  # PBSはこのディレクトリがなければ ufal/whisper_streaming をcloneします。
  repo_dir: vendor/whisper_streaming
  language: ja
  task: transcribe
  backend: faster-whisper
  min_chunk_size: 1.0
  buffer_trimming: segment
  buffer_trimming_sec: 15
  vad: false
  warmup: true

model:
  # ここを作成済みCTranslate2モデルのディレクトリに変更してください。
  model_dir: /path/to/your/ctranslate2-finetuned-whisper
  device: cuda
  device_index: 0
  compute_type: float16
  beam_size: 5

metrics:
  # trueの場合、fugashi/unidic-liteで日本語を分かち書きしてWERを出します。
  # 失敗時は文字単位にフォールバックします。
  japanese_word_tokenizer: true
